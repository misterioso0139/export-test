<!doctype html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>切片器連動測試</title>
<style>
  :root { color-scheme: light dark; }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%;
    background: transparent !important;
    font-family: "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif;
  }
  body { padding: 16px; display: flex; flex-direction: column; gap: 10px; }

  /* 展示狀態：只有一個大數字，方便切換切片器時盯著看 */
  #big { display: none; flex: 1; flex-direction: column;
         align-items: center; justify-content: center; gap: 6px; }
  #big.show { display: flex; }
  #count { font-size: 56px; font-weight: 700; line-height: 1; }
  #countLabel { font-size: 13px; color: #888; }
  #stamp { font-size: 11px; color: #aaa; }

  /* 設定狀態 */
  #cfg { display: none; flex-direction: column; gap: 12px; }
  #cfg.show { display: flex; }
  label { display: block; margin-bottom: 5px; color: #666; font-size: 13px; }
  select {
    width: 100%; padding: 7px 8px; font-size: 13px;
    border: 1px solid rgba(128,128,128,.4); border-radius: 5px;
    background: transparent; color: inherit;
  }
  button {
    padding: 9px 16px; border: none; border-radius: 5px;
    background: #3370ff; color: #fff; font-size: 14px; cursor: pointer;
  }
  .tip { font-size: 12px; color: #888; line-height: 1.6; }
  #log {
    font-size: 11px; line-height: 1.7; white-space: pre-wrap;
    max-height: 160px; overflow: auto; color: #667085;
    border-top: 1px solid rgba(128,128,128,.2); padding-top: 8px;
  }
  .bad { color: #b42318; }
  .ok  { color: #1a7f37; }
</style>
</head>
<body>

<div id="big">
  <div id="count">—</div>
  <div id="countLabel">getData() 回傳的筆數</div>
  <div id="stamp"></div>
</div>

<div id="cfg">
  <div class="tip">
    選一個「每筆記錄都不一樣」的欄位當分組依據（例如 UID）。
    這樣 getData() 回傳的列數就等於通過篩選的記錄數。
  </div>
  <div><label for="tableSel">資料表</label><select id="tableSel"></select></div>
  <div><label for="fieldSel">分組欄位（建議選 UID）</label><select id="fieldSel"></select></div>
  <button id="save">儲存並套用</button>
</div>

<div id="log"></div>

<script type="module">
import { bitable, dashboard, DashboardState, SourceType }
  from 'https://cdn.jsdelivr.net/npm/@lark-base-open/js-sdk@1.0.2/+esm';

const $ = id => document.getElementById(id);
const big = $('big'), cfg = $('cfg'), countEl = $('count'), stampEl = $('stamp');
const tableSel = $('tableSel'), fieldSel = $('fieldSel'), saveBtn = $('save');
const logEl = $('log');

const lines = [];
function say(t, cls) {
  lines.push(cls ? `<span class="${cls}">${t}</span>` : t);
  if (lines.length > 8) lines.shift();
  logEl.innerHTML = lines.join('\n');
  logEl.scrollTop = logEl.scrollHeight;
}
window.addEventListener('unhandledrejection', e => {
  const m = e.reason?.message || String(e.reason);
  if (!/ResizeObserver/.test(m)) say('未處理：' + m, 'bad');
});

const condition = (tableId, fieldId) => ({
  tableId,
  dataRange: { type: SourceType.ALL },
  groups: [{ fieldId }],
  series: 'COUNTA'
});

// ---------- 設定狀態 ----------
async function setupConfig() {
  cfg.classList.add('show');
  const tables = await bitable.base.getTableMetaList();
  for (const t of tables) tableSel.add(new Option(t.name, t.id));

  let saved = null;
  if (dashboard.state !== DashboardState.Create) {
    saved = await dashboard.getConfig().catch(() => null);
  }
  const c = saved?.customConfig;
  if (c?.tableId && [...tableSel.options].some(o => o.value === c.tableId)) {
    tableSel.value = c.tableId;
  }
  await loadFields(c?.fieldId);
}

async function loadFields(prefer) {
  fieldSel.innerHTML = '';
  const cats = await dashboard.getCategories(tableSel.value);
  for (const c of cats) fieldSel.add(new Option(c.fieldName, c.fieldId));

  // 沒指定的話，優先挑名字含 UID 的欄位
  const uid = [...fieldSel.options].find(o => /uid|編號|id/i.test(o.text));
  if (prefer && [...fieldSel.options].some(o => o.value === prefer)) {
    fieldSel.value = prefer;
  } else if (uid) {
    fieldSel.value = uid.value;
  }
  await previewCount();
}

async function previewCount() {
  if (!tableSel.value || !fieldSel.value) return;
  try {
    const data = await dashboard.getPreviewData(
      condition(tableSel.value, fieldSel.value));
    say(`預覽：${Math.max(0, (data?.length || 0) - 1)} 列`, 'ok');
  } catch (e) { say('預覽失敗：' + e.message, 'bad'); }
}

tableSel.onchange = () => loadFields();
fieldSel.onchange = previewCount;

saveBtn.onclick = async () => {
  saveBtn.disabled = true;
  try {
    await dashboard.saveConfig({
      dataConditions: [condition(tableSel.value, fieldSel.value)],
      customConfig: { tableId: tableSel.value, fieldId: fieldSel.value }
    });
  } catch (e) { say('存檔失敗：' + e.message, 'bad'); saveBtn.disabled = false; }
};

// ---------- 展示狀態 ----------
function paint(data, source) {
  const n = Math.max(0, (data?.length || 0) - 1);
  countEl.textContent = n;
  stampEl.textContent = `${source}　${new Date().toLocaleTimeString()}`;
}

async function showCount() {
  cfg.classList.remove('show');
  big.classList.add('show');
  try {
    paint(await dashboard.getData(), 'getData');
    say('✓ getData 成功', 'ok');
  } catch (e) {
    countEl.textContent = '✗';
    stampEl.textContent = e.message;
    say('getData 失敗：' + e.message, 'bad');
  }
  dashboard.setRendered().catch(() => {});
}

if (dashboard.state === DashboardState.Create ||
    dashboard.state === DashboardState.Config) {
  setupConfig().catch(e => say('初始化失敗：' + e.message, 'bad'));
} else {
  showCount();
}

// 這個才是重點：切片器如果有連動，這裡會被觸發
dashboard.onDataChange(({ data }) => {
  paint(data, 'onDataChange');
  say('★ onDataChange 觸發了，筆數 ' + Math.max(0, (data?.length || 0) - 1), 'ok');
});
dashboard.onConfigChange(() => showCount());
</script>

</body>
</html>
